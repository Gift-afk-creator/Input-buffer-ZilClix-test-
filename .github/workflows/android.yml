
name: Build Android Geode mod

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Android Geode mod
        id: build
        uses: geode-sdk/build-geode-mod@main
        with:
          target: Android64

      - name: Upload Geode file
        uses: actions/upload-artifact@v4
        with:
          name: ZilClix-InputBuffer-Android64
          path: ${{ steps.build.outputs.build-output }}/*.geode
          if-no-files-found: error
          
